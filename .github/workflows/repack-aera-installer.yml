name: Repackage an existing AERA installer

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing cloud-built release
        required: true
        default: AERA-17.0-28-f20b5aaa
      source_commit:
        description: Exact image source commit
        required: true
        default: f20b5aaad284ed2bea1432fea49fba09771a9c84
      output_tag:
        description: Separate release for the corrected installer
        required: true
        default: AERA-17.0-28-f20b5aaa-slotfix1

permissions:
  contents: read

jobs:
  repackage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install certificate inspection dependency
        run: sudo apt-get update -qq && sudo apt-get install -y python3-cryptography
      - name: Preserve the existing image and sign a corrected installer
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          OUTPUT_TAG: ${{ inputs.output_tag }}
        run: |
          python3 tools/repack_aera_installer.py \
            "$GITHUB_REPOSITORY" "$SOURCE_TAG" "$SOURCE_COMMIT" \
            "$OUTPUT_TAG" "$RUNNER_TEMP/repacked-release"
      - name: Preserve signed installer for authenticated publication
        uses: actions/upload-artifact@v4
        with:
          name: corrected-installer
          compression-level: 0
          path: |
            ${{ runner.temp }}/repacked-release/AERA-infiniti-aera-17.0-recovery.zip
            ${{ runner.temp }}/repacked-release/SHA256SUMS
            ${{ runner.temp }}/repacked-release/catalog.json
            ${{ runner.temp }}/repacked-release/catalog-nightly.json
            ${{ runner.temp }}/repacked-release/installer-repack-report.json
            ${{ runner.temp }}/repacked-release/RELEASE_NOTES.md
