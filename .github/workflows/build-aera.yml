name: Build AERA Recovery infiniti

on:
  push:
    branches:
      - aera-16.0
    paths-ignore:
      - ".github/workflows/**"
      - "tools/publish_aera_gitee_branch.sh"
      - "tools/patch_aera_integrations.py"
      - "tools/prepare_aera_gitee_recovery_assets.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aera-recovery-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      AERA_ROOT: /home/runner/android/AERA_16.0
      AERA_OUT: /home/runner/android/AERA_16.0/out
      GH_TOKEN: ${{ github.token }}
      GITEE_REPOSITORY: zaomi/android_device_oneplus_infiniti-AERA
      CCACHE_EXEC: /usr/bin/ccache
      USE_CCACHE: "1"

    steps:
      - name: Check out infiniti device tree
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev libgl1-mesa-dev libncurses-dev libssl-dev \
            libxml2 libxml2-utils lz4 lzop openjdk-17-jdk pngcrush python3 \
            python3-cryptography python3-requests python-is-python3 rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev

      - name: Restore Android compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/aera-ccache
          key: aera-ccache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aera-ccache-v1-${{ runner.os }}-

      - name: Configure Android compiler cache
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/aera-ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CCACHE_DIR"
          ccache --version
          ccache -M 4G
          ccache --show-stats

      - name: Install repo and sync AERA Android 16 sources
        run: |
          mkdir -p "$HOME/bin" "$(dirname "$AERA_ROOT")"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          mkdir -p "$AERA_ROOT"
          cd "$AERA_ROOT"
          "$HOME/bin/repo" init --depth=1 \
            -u https://github.com/AERA-Recovery/android_manifest.git \
            -b aera-16.0

          # AERA manifest sources are public, so use HTTPS instead of requiring
          # an SSH private key on the hosted runner.
          while IFS= read -r -d '' manifest_file; do
            sed -i 's#ssh://git@github.com/AERA-Recovery#https://github.com/AERA-Recovery#g' "$manifest_file"
          done < <(find .repo/manifests -type f -name '*.xml' -print0)
          if grep -Rqs 'ssh://git@github.com/AERA-Recovery' .repo/manifests; then
            echo "AERA SSH remotes remain in the manifest checkout" >&2
            exit 1
          fi

          # The minimal manifest removes curl. Restore the matching Android 16
          # source so recovery can use BoringSSL and verify HTTPS certificates.
          sed -i '\#<remove-project path="external/curl"#d' .repo/manifests/remove-minimal.xml

          "$HOME/bin/repo" sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)"
          df -h "$AERA_ROOT"

      - name: Overlay OnePlus 15 infiniti device tree
        run: |
          device_tree="$AERA_ROOT/device/oneplus/infiniti"
          mkdir -p "$device_tree"
          rsync -a --exclude='.git/' --exclude='.github/' \
            --exclude='vendor/aera-plugins/' \
            "$GITHUB_WORKSPACE/" "$device_tree/"
          test -f "$device_tree/AndroidProducts.mk"
          test -s "$device_tree/avb/recovery-vbmeta.bin"
          test -s "$device_tree/tools/transplant_avb.sh"
          grep -Fq 'twrp_infiniti-eng' "$device_tree/AndroidProducts.mk"

      - name: Set Simplified Chinese, Beijing time, and 24-hour defaults
        run: |
          python3 "$GITHUB_WORKSPACE/tools/patch_aera_defaults.py" \
            "$AERA_ROOT/bootable/recovery"

      - name: Use this repository for OTA and signed plugin downloads
        run: |
          python3 "$GITHUB_WORKSPACE/tools/patch_aera_resolver.py" "$AERA_ROOT"
          python3 "$GITHUB_WORKSPACE/tools/patch_aera_integrations.py" \
            "$AERA_ROOT" "$GITHUB_REPOSITORY" "$GITEE_REPOSITORY"
          python3 "$GITHUB_WORKSPACE/tools/patch_aera_https.py" "$AERA_ROOT"

      - name: Add temporary swap space for Soong
        run: |
          sudo fallocate -l 12G /swapfile-extra
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra
          free -h
          swapon --show
          df -h "$AERA_ROOT"

      - name: Build AERA recovery image and installer ZIP
        run: |
          cd "$AERA_ROOT"
          export PATH="$HOME/bin:$PATH"
          export OUT_DIR="$AERA_OUT"
          ccache --zero-stats
          source build/envsetup.sh
          lunch twrp_infiniti-bp2a-eng

          mka adbd curl recoveryimage &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 60
            if kill -0 "$build_pid" 2>/dev/null; then
              echo "AERA recovery build is still active at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              ps -eo pid,ppid,stat,etime,%cpu,%mem,rss,comm --sort=-%cpu | head -n 12
              free -h
              df -h "$AERA_ROOT"
            fi
          done
          wait "$build_pid"

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Save Android compiler cache
        if: always() && steps.ccache-restore.outcome == 'success' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/aera-ccache
          key: aera-ccache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove temporary swap space
        if: success()
        run: |
          sudo swapoff /swapfile-extra
          sudo rm /swapfile-extra

      - name: Transplant AVB into image and AERA installer ZIP
        run: |
          product_dir="$AERA_OUT/target/product/infiniti"
          recovery_image="$product_dir/AERA-R1.0-Beta-Official-infiniti.img"
          source_zip="$product_dir/AERA-R1.0-Beta-Official-infiniti.zip"
          release_dir="$RUNNER_TEMP/aera-infiniti-release"
          image_name="AERA-infiniti-aera-17.0-recovery.img"
          zip_name="AERA-infiniti-aera-17.0-recovery.zip"

          test -s "$recovery_image"
          test -s "$source_zip"
          mkdir -p "$release_dir"
          bash "$GITHUB_WORKSPACE/tools/transplant_avb.sh" \
            "$GITHUB_WORKSPACE/avb/recovery-vbmeta.bin" \
            "$recovery_image" "$release_dir/$image_name"

          package_dir="$RUNNER_TEMP/aera-infiniti-installer"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          unzip -q "$source_zip" -d "$package_dir"
          test -s "$package_dir/recovery.img"
          cp -f "$release_dir/$image_name" "$package_dir/recovery.img"
          (
            cd "$package_dir"
            zip -X -q -r "$release_dir/$zip_name" .
          )

          signer_script=$(find "$AERA_ROOT/vendor/recovery" \
            -type f -path '*/signature/sign_zip.sh' -print -quit)
          if [ -z "$signer_script" ]; then
            echo "AERA ZIP signer is missing; refusing to publish an unsigned OTA ZIP" >&2
            exit 1
          fi
          bash "$signer_script" -z "$release_dir/$zip_name"

          (
            cd "$release_dir"
            sha256sum "$image_name" "$zip_name" > SHA256SUMS
          )
          stat "$release_dir/$image_name" "$release_dir/$zip_name"

      - name: Create AERA update catalogs
        run: |
          python3 - "$RUNNER_TEMP/aera-infiniti-release" \
            "$GITHUB_REPOSITORY" "$GITEE_REPOSITORY" \
            "$GITHUB_RUN_NUMBER" "${GITHUB_SHA:0:8}" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys
          import time

          release_dir = Path(sys.argv[1])
          repository = sys.argv[2]
          gitee_repository = sys.argv[3]
          release_tag = f"AERA-17.0-{sys.argv[4]}-{sys.argv[5]}"
          filename = "AERA-infiniti-aera-17.0-recovery.zip"
          package = release_dir / filename
          entry = {
              "version": "R1.0",
              "build_type": "Beta",
              "build_time": int(time.time()),
              "filename": filename,
              "size": package.stat().st_size,
              "sha256": hashlib.sha256(package.read_bytes()).hexdigest(),
              "ota_url": f"https://gitee.com/{gitee_repository}/releases/download/{release_tag}/{filename}",
              "fallback_url": f"https://github.com/{repository}/releases/download/{release_tag}/{filename}",
              "changelog": [
                  "Synced the latest upstream Infiniti recovery changes.",
                  "Published with this repository's AVB-transplanted recovery image.",
              ],
          }
          catalog = {"schema": 1, "devices": {"infiniti": entry}}
          encoded = json.dumps(catalog, ensure_ascii=False, indent=2) + "\n"
          for name in ("catalog.json", "catalog-nightly.json"):
              (release_dir / name).write_text(encoded, encoding="utf-8")
          PY

      - name: Prepare Gitee raw asset parts for mainland downloads
        run: |
          release_dir="$RUNNER_TEMP/aera-infiniti-release"
          release_tag="AERA-17.0-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          python3 "$GITHUB_WORKSPACE/tools/prepare_aera_gitee_recovery_assets.py" \
            "$release_dir" "$RUNNER_TEMP/aera-gitee-recovery-assets" \
            "$GITEE_REPOSITORY" "$GITHUB_REPOSITORY" "$release_tag"

      - name: Publish AERA recovery GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$RUNNER_TEMP/aera-infiniti-release"
          release_tag="AERA-17.0-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          gh release create "$release_tag" "$release_dir"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AERA Recovery 17.0 for OnePlus 15 (infiniti)" \
            --notes "Android 16 AERA source branch with the latest upstream Infiniti changes. Includes the AVB-transplanted recovery image, signed AERA installer ZIP, update catalogs, and SHA256SUMS." \
            --latest

      - name: Upload AERA recovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: AERA-infiniti-aera-17.0-${{ github.sha }}
          path: ${{ runner.temp }}/aera-infiniti-release/
          if-no-files-found: error
          retention-days: 14
