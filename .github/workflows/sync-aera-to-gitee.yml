name: Sync AERA build to Gitee

on:
  workflow_run:
    workflows:
      - Build AERA Recovery infiniti
    types:
      - completed
    branches:
      - aera-16.0
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: aera-gitee-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPOSITORY: zaomi/android_device_oneplus_infiniti-AERA
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}

    steps:
      - name: Skip if a newer recovery build has already succeeded
        id: freshness
        env:
          CURRENT_BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          if [[ -z "$CURRENT_BUILD_NUMBER" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Build AERA Recovery infiniti" \
            --branch aera-16.0 \
            --limit 100 \
            --json number,conclusion)"
          newer_success="$(jq --argjson current "$CURRENT_BUILD_NUMBER" \
            '[.[] | select(.number > $current and .conclusion == "success")] | length' \
            <<< "$runs")"
          if [[ "$newer_success" != "0" ]]; then
            echo "A newer recovery build already succeeded; skipping this older Gitee mirror."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out current source and mirror tools
        if: ${{ steps.freshness.outputs.proceed == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: aera-16.0
          fetch-depth: 0

      - name: Require Gitee token
        if: ${{ steps.freshness.outputs.proceed == 'true' }}
        run: |
          if [[ -z "$GITEE_TOKEN" ]]; then
            echo "::error::Add the GITEE_TOKEN repository secret before syncing to Gitee."
            exit 1
          fi

      - name: Push latest source branch to Gitee
        if: ${{ steps.freshness.outputs.proceed == 'true' }}
        env:
          GITEE_USERNAME: zaomi
        run: |
          cat > "$RUNNER_TEMP/gitee-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/gitee-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/gitee-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          git fetch origin aera-16.0
          git push \
            "https://gitee.com/${GITEE_REPOSITORY}.git" \
            "refs/remotes/origin/aera-16.0:refs/heads/aera-16.0"

      - name: Download the GitHub Release produced by the completed build
        if: ${{ steps.freshness.outputs.proceed == 'true' }}
        id: release
        run: |
          if [[ -n "$SOURCE_RUN_NUMBER" ]]; then
            release_tag="AERA-17.0-${SOURCE_RUN_NUMBER}-${SOURCE_SHA:0:8}"
          else
            release_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          release_dir="$RUNNER_TEMP/aera-infiniti-release"
          mkdir -p "$release_dir"
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$release_dir"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Prepare chunked recovery assets and Gitee OTA catalogs
        if: ${{ steps.freshness.outputs.proceed == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_DIR: ${{ steps.release.outputs.dir }}
        run: |
          release_assets="$RUNNER_TEMP/aera-gitee-recovery-assets"
          python3 "$GITHUB_WORKSPACE/tools/prepare_aera_gitee_recovery_assets.py" \
            "$RELEASE_DIR" "$release_assets" "$GITEE_REPOSITORY" \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG"

      - name: Publish chunked recovery assets and OTA catalog to Gitee
        if: ${{ steps.freshness.outputs.proceed == 'true' }}
        run: |
          bash "$GITHUB_WORKSPACE/tools/publish_aera_gitee_branch.sh" \
            "$GITEE_REPOSITORY" "aera-recovery-assets" \
            "$RUNNER_TEMP/aera-gitee-recovery-assets"
